<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Health Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>System Health Dashboard</h1>
    <p id="meta">Loading...</p>
  </header>

  <section class="cards">
    <div class="card"><h3>CPU</h3><div class="big" id="cpu">--</div><div class="bar"><div id="cpu-bar"></div></div><small id="cores"></small></div>
    <div class="card"><h3>RAM</h3><div class="big" id="ram">--</div><div class="bar"><div id="ram-bar"></div></div><small id="ram-detail"></small></div>
    <div class="card"><h3>Disk</h3><div class="big" id="disk">--</div><div class="bar"><div id="disk-bar"></div></div><small id="disk-detail"></small></div>
    <div class="card"><h3>Temperature</h3><div class="big" id="temp">N/A</div><small>Not available on virtual machines</small></div>
  </section>

  <section class="charts">
    <div class="card"><h3>CPU &amp; RAM (live)</h3><canvas id="usageChart"></canvas></div>
    <div class="card"><h3>Network speed (KB/s)</h3><canvas id="netChart"></canvas></div>
  </section>

  <section class="card">
    <h3>Top 5 processes (CPU)</h3>
    <table>
      <thead><tr><th>PID</th><th>Name</th><th>CPU %</th><th>RAM %</th></tr></thead>
      <tbody id="proc-body"></tbody>
    </table>
  </section>

  <script src="/static/script.js"></script>
</body>
</html>
